name: Daily MMS Bursa Malaysia scan

on:
  schedule:
    # 10:15 UTC Monday-Friday = 6:15 pm Malaysia time, after Bursa closes at 5:00 pm
    - cron: "15 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bursa-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Bursa agents
        run: |
          node test/engine.test.js
          node src/run-bursa.js
          node src/build.js
      - name: Commit results
        run: |
          git config user.name  "mms-screener-bot"
          git config user.email "mms-screener-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Daily Bursa scan $(date -u +%F)"
          git pull --rebase
          git push
