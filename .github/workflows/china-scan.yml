name: Daily MMS China A-share scan

on:
  schedule:
    # 08:15 UTC Monday-Friday = 4:15 pm Malaysia/China time, after Shanghai and Shenzhen close at 3:00 pm
    - cron: "15 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: china-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run China agents
        run: |
          node test/engine.test.js
          node src/run-china.js
          node src/build.js
      - name: Commit results
        run: |
          git config user.name  "mms-screener-bot"
          git config user.email "mms-screener-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Daily China scan $(date -u +%F)"
          git pull --rebase
          git push
