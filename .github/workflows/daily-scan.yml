name: Daily MMS scan

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run agents
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          DATA_PROVIDER: ${{ vars.DATA_PROVIDER }}
          # Agent Desk financial-report decoder: the SEC asks for "Your Name your@email" (repo Settings -> Variables)
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          node test/engine.test.js
          node test/desk.test.js
          node src/run.js
          node src/build.js
      - name: Commit results
        if: always()
        run: |
          git config user.name  "mms-screener-bot"
          git config user.email "mms-screener-bot@users.noreply.github.com"
          git add docs data || true
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git pull --rebase
          git push
